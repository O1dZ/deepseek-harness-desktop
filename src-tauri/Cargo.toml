[package]
name = "deepseek-harness-desktop"
version = "0.1.1"
description = "Windows desktop companion for DeepSeek Harness"
authors = ["DeepSeek Harness Desktop contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[features]
default = []
full-runtime = []

[lib]
name = "deepseek_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "deepseek-harness-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
parking_lot = "0.12"
rfd = "0.15"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
url = "2"
win32job = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
